# Insighter+ live data — fully automatic, zero-touch.
# Every 5 minutes this fetches real market data (Syria parallel rates + gold,
# Central Bank bulletin, crypto, FX, metals, stocks, Gulf markets, Fear & Greed,
# BBC headlines, economic calendar) and commits data/live.json to main.
# 5 minutes is the fastest GitHub Actions allows (its minimum schedule
# interval); the site itself re-fetches the file every minute client-side.
# The site (GitHub Pages) serves the fresh file automatically.
# Self-healing: the updater keeps the last good figure for any source that
# fails, never writes invalid data, and retries on the next run. No manual
# steps exist anywhere in this loop.
name: Update live data

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub's minimum interval — fastest allowed
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-live-data.yml'
      - 'scripts/update-live-data.mjs'
      - 'scripts/seed.json'

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # OCR tools for the Central Bank bulletin (Telegram @SyCBOS photo ->
      # tesseract). Installed fresh on every run — runners are ephemeral, so
      # there is nothing to cache; --no-install-recommends keeps it lean
      # (~1 min on GitHub's runners). The updater itself never needs these
      # tools to be present to keep the last good data (OCR failure is a
      # soft failure: the old central table stays live).
      # eng only: the bulletin table, codes and numbers are all Latin, and
      # eng-only OCR is both faster and more accurate on this image than
      # eng+ara (verified on Bulletin 213 — ara data is NOT installed).
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng imagemagick

      - name: Fetch live data
        run: node scripts/update-live-data.mjs

      - name: Validate live.json
        run: node -e "const d=require('./data/live.json'); if(!d.fetched_at||!d.syria?.usd?.parallel_sell) throw new Error('live.json invalid'); console.log('live.json valid, fetched_at:', d.fetched_at)"

      - name: Commit if changed
        run: |
          git config user.name "insighter-plus-bot"
          git config user.email "insighter-plus-bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update live market data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
