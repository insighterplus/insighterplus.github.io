# Insighter+ push notifications (FCM, data-only messages).
#
# Sends the daily prices messages (morning 10:00 + evening 20:00
# Damascus), instant prices on demand (kind: now, from Badr's admin
# app) and announcements on demand. The Node script is
# zero-dependency: it authenticates with the Firebase service account
# via a JWT and posts to the FCM HTTP v1 API.
#
# REQUIRED SECRET: FIREBASE_SERVICE_ACCOUNT — the full JSON of the
# Firebase service-account key for project insighter-plus.
#
# NO SCHEDULE TRIGGER (removed 18 Nov 2026): GitHub's scheduler on
# this org repo fires hours late (observed 16/17/18 Nov: the 07:00 UTC
# run fired ~19:17 Damascus), sending the morning-titled message in
# the evening and duplicating the morning send. All sends are driven
# by workflow_dispatch only: the morning dispatch cron (10:00
# Damascus), the evening dispatch cron (20:00 Damascus), Badr's admin
# app (kind: now / announcement), or a manual run. Do NOT re-add a
# schedule trigger.
name: Send notifications

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'morning, evening, now or announcement'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
          - now
          - announcement
      title_ar:
        description: 'Announcement title (Arabic) — announcement only'
        required: false
        type: string
      body_ar:
        description: 'Announcement body (Arabic) — announcement only'
        required: false
        type: string
      title_en:
        description: 'Announcement title (English) — announcement only'
        required: false
        type: string
      body_en:
        description: 'Announcement body (English) — announcement only'
        required: false
        type: string
      link:
        description: 'Announcement link (http/https) — announcement only, optional'
        required: false
        type: string
      page:
        description: 'Announcement deep-link page (decisions, syria, home, ...) — announcement only, optional'
        required: false
        type: string
      dry_run:
        description: 'Print the messages without sending'
        required: false
        default: false
        type: boolean
      test:
        description: 'Send ONLY to the test topics (admin app) — never to the public topics'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ARGS=(--kind "${{ inputs.kind || 'morning' }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS+=(--test); fi
          if [ -n "${{ inputs.title_ar }}" ]; then ARGS+=(--title-ar "${{ inputs.title_ar }}"); fi
          if [ -n "${{ inputs.body_ar }}" ]; then ARGS+=(--body-ar "${{ inputs.body_ar }}"); fi
          if [ -n "${{ inputs.title_en }}" ]; then ARGS+=(--title-en "${{ inputs.title_en }}"); fi
          if [ -n "${{ inputs.body_en }}" ]; then ARGS+=(--body-en "${{ inputs.body_en }}"); fi
          if [ -n "${{ inputs.link }}" ]; then ARGS+=(--link "${{ inputs.link }}"); fi
          if [ -n "${{ inputs.page }}" ]; then ARGS+=(--page "${{ inputs.page }}"); fi
          node scripts/send-notification.mjs "${ARGS[@]}"
